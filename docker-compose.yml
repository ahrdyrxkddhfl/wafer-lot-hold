# 개발·테스트용 PostgreSQL. 사용자 이름·DB 이름·포트는 config/mes.yaml의 db 값과 같아야 한다.
# 이미지 버전은 GitHub Actions(.github/workflows/test.yml)와 같게 고정한다.
# 같은 컴퓨터에 이 저장소를 하나 더 띄울 때는 .env의 POSTGRES_PORT·POSTGRES_CONTAINER·COMPOSE_PROJECT_NAME을
# 바꿔 포트·컨테이너·볼륨이 겹치지 않게 한다(값이 없으면 아래 기본값).
services:
  postgres:
    image: postgres:17.11
    container_name: ${POSTGRES_CONTAINER:-wafer-lot-hold-postgres}
    environment:
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정할 것}
      POSTGRES_DB: wafer_mes
    ports:
      # 호스트 5434 → 컨테이너 5432. 다른 프로젝트가 쓰는 5432·5433과 겹치지 않게 한다.
      # POSTGRES_PORT를 주면 그 포트를 쓴다(mes/db.py도 같은 값을 읽는다).
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d wafer_mes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
