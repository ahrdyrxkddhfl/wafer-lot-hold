# MES(mes/) 설정. 비밀번호는 여기 쓰지 않고 .env의 POSTGRES_PASSWORD에서 읽는다.
# 공정 순서와 설비 목록·상태는 실제 공장 값이 아닌 합성값이다.

db:
  host: localhost
  port: 5434                    # docker-compose.yml의 호스트 포트와 같아야 한다
  user: mes                     # docker-compose.yml의 POSTGRES_USER와 같아야 한다
  dbname: wafer_mes             # 개발용 DB
  # 테스트 전용 DB. 테스트가 시작할 때 스키마를 지우고 다시 만들며, 테스트마다 모든 테이블을 비운다.
  # 개발용 DB 이름과 같으면 개발 데이터가 지워지므로 테스트가 시작하지 않는다.
  test_dbname: wafer_mes_test

# 공정 순서. 적힌 순서가 곧 진행 순서이며 이 순서 밖으로는 진행할 수 없다(I1).
# 공정을 늘리면 Lot이 거쳐야 할 단계가 늘어난다.
route:
  - STEP_1
  - STEP_2
  - INSPECT
  - SHIP

# 공정별 설비. 처음에는 모두 AVAILABLE로 넣는다.
# 한 설비는 한 번에 Lot 하나만 처리한다(I11). 대수가 많으면 동시에 처리할 수 있는 Lot이 늘어난다.
# 앞의 세 공정은 정지 설비 우회(I6)와 동시 투입(I7) 시연을 위해 2대씩 둔다.
# SHIP도 다른 공정과 같은 흐름(투입→완료)을 쓰도록 출하 스테이션 1대를 둔다.
equipment:
  STEP_1: [S1-EQ-01, S1-EQ-02]
  STEP_2: [S2-EQ-01, S2-EQ-02]
  INSPECT: [IN-EQ-01, IN-EQ-02]
  SHIP: [SH-ST-01]
