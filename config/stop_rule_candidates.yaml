# 정지 규칙 후보 비교(4단계 보완). 검증용 Lot에서만 비교하고, 시험용 Lot에는 적용하지 않는다.
# 조합을 다 돌리지 않고 기준 규칙에서 한 번에 한 변수만 바꾼다.
# 기준 규칙: 불량 유형 전체, 확률 하한 없음(0.0), Lot당 1장 이상이면 정지.

# (a) 정지 대상 유형. 검증용 Lot의 라벨 있는 none 웨이퍼에서 불량으로 잘못 판정된 횟수가 많은 유형부터
#     몇 개를 정지 대상에서 뺄지. 크면 괜히 멈추는 Lot이 줄지만, 뺀 유형의 실제 불량은 멈추지 않는다.
exclude_top_false_alarm_types: [0, 1, 2, 3]

# (b) 판정 확률 하한. 판정한 유형의 확률이 이보다 낮으면 세지 않는다.
#     크면 확신 있는 판정만 세서 덜 멈추고, 놓치는 Lot이 늘 수 있다.
min_probs: [0.0, 0.5, 0.7, 0.9]

# (c) Lot당 최소 장수. 정지 대상 판정이 이 장수 이상이어야 멈춘다.
#     크면 한두 장의 오판정으로는 멈추지 않지만, 불량 웨이퍼가 적은 Lot을 놓친다.
min_counts: [1, 2, 3, 5]
